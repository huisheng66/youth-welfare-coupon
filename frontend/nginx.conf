# 容器内 nginx 配置：SPA + /api 反代到后端容器
# 监听 8080（非 root），与 docker-compose 端口映射配合
#
# map 在 conf.d 中合法（include 于 http{}）：Caddy 终结 TLS 时会传入
# X-Forwarded-Proto=https，不可再被 $scheme(http) 覆盖。

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # 基础安全响应头（与 FastAPI 中间件双保险）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 敏感路径：禁止 SPA try_files 回退到 index.html
    location ~* /(\.env|\.git|\.svn|\.DS_Store|docker-compose|package-lock\.json) {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }

    # API 反代到后端容器（compose 中 service 名为 api）
    location /api/ {
        proxy_pass http://api:19001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 生产：不暴露 OpenAPI 文档
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
