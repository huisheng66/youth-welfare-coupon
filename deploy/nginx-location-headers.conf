# 安全响应头（含 CSP）。安装到 /etc/nginx/snippets/welfare-location-headers.conf
#
# 为什么需要单独一个片段：nginx 的 add_header 是「就近覆盖」——某个 location
# 一旦出现自己的 add_header（expires 指令内部也会加头），server 级的
# add_header 就完全不再继承。`location ^~ /assets/` 与 `location = /index.html`
# 用了 expires，因此必须显式 include 本片段，否则这两个 location 会丢掉
# HSTS / CSP / X-Frame-Options 等全部安全头（生产实测）。
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; form-action 'self'" always;
