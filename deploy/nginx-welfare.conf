# 放到 /etc/nginx/sites-available/welfare
# ln -s /etc/nginx/sites-available/welfare /etc/nginx/sites-enabled/
# 前端构建产物目录：/opt/welfare/frontend/dist
# 后端：127.0.0.1:19001

server {
    listen 80;
    server_name your-domain.com;   # 改成域名或服务器 IP

    # 若用 certbot 申请 HTTPS，可先保留 HTTP，再 certbot --nginx

    root /opt/welfare/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # 基础安全响应头（与 FastAPI 中间件双保险）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 按需收紧 CSP；含内联脚本时需评估
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:19001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 生产：不反代 OpenAPI 文档（应用层 OPENAPI_ENABLED=false 时亦为 404）
    # 若需临时调试，可取消注释并设置 OPENAPI_ENABLED=true
    # location /docs {
    #     proxy_pass http://127.0.0.1:19001;
    #     proxy_set_header Host $host;
    # }
    # location /openapi.json {
    #     proxy_pass http://127.0.0.1:19001;
    #     proxy_set_header Host $host;
    # }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
