# 放到 /etc/nginx/sites-available/welfare
# ln -s /etc/nginx/sites-available/welfare /etc/nginx/sites-enabled/
# 前端构建产物目录：/opt/welfare/frontend/dist
# 后端：127.0.0.1:19001

server {
    listen 80;
    server_name your-domain.com;   # 改成域名或服务器 IP

    # 若用 certbot 申请 HTTPS，可先保留 HTTP，再 certbot --nginx

    root /opt/welfare/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:19001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # OpenAPI（可选，生产可注释掉）
    location /docs {
        proxy_pass http://127.0.0.1:19001;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:19001;
        proxy_set_header Host $host;
    }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
