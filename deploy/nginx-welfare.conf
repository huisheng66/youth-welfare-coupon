# 放到 /etc/nginx/sites-available/welfare
# ln -s /etc/nginx/sites-available/welfare /etc/nginx/sites-enabled/
# 前端构建产物目录：/opt/welfare/frontend/dist
# 后端：127.0.0.1:19001

server {
    listen 80;
    server_name your-domain.com;   # 改成域名或服务器 IP

    # 若用 certbot 申请 HTTPS，可先保留 HTTP，再 certbot --nginx

    root /opt/welfare/frontend/dist;
    index index.html;
    server_tokens off;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 需配合 conf.d 中 welfare_timed 格式（见 enable-nginx-request-time.sh）
    access_log /var/log/nginx/welfare-access.log welfare_timed;

    # 基础安全响应头（与 FastAPI 中间件双保险）
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; form-action 'self'" always;

    # 敏感路径：禁止 SPA try_files 回退到 index.html
    location ~* /(\.env|\.git|\.svn|\.hg|\.DS_Store|docker-compose|composer\.(json|lock)|package-lock\.json) {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }
    location ^~ /backend/ { return 404; }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:19001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr 在 conf.d/cloudflare-realip.conf 生效后为真实访客
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 生产：不反代 OpenAPI 文档（应用层 OPENAPI_ENABLED=false 时亦为 404）
    # 若需临时调试，可取消注释并设置 OPENAPI_ENABLED=true
    # location /docs {
    #     proxy_pass http://127.0.0.1:19001;
    #     proxy_set_header Host $host;
    # }
    # location /openapi.json {
    #     proxy_pass http://127.0.0.1:19001;
    #     proxy_set_header Host $host;
    # }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Vite 文件名含内容哈希，可安全长期缓存；入口 HTML 每次校验更新。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
