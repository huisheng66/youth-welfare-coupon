name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Security hardening tests
        env:
          GLOBAL_IP_MAX_REQUESTS: "0"
          RATE_LIMIT_BACKEND: memory
          APP_ENV: development
          SEED_DEMO_ACCOUNTS: "false"
        run: python tests/test_security_hardening.py

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install -U pip "pip-audit>=2.7"
      - name: Audit requirements.txt
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  npm-audit:
    name: npm audit (production high+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (ci)
        run: npm ci
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  # ZAP needs a live staging URL — not run on every PR.
  # Trigger manually after deploying staging; set secret/var ZAP_TARGET if desired.
  zap-baseline:
    name: ZAP baseline (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check target
        env:
          TARGET: ${{ vars.ZAP_TARGET }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "Set repository variable ZAP_TARGET to staging URL, or skip this job."
            echo "Documented procedure: docs/security-ops.md and scripts/zap-baseline.sh"
            exit 0
          fi
          mkdir -p reports
          docker run --rm -v "$(pwd)/reports:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET" -r zap-baseline-ci.html -I
      - name: Upload report
        if: hashFiles('reports/zap-baseline-ci.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: reports/zap-baseline-ci.html
